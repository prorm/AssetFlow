---
- name: Install curl and CA certificates
  ansible.builtin.apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Add the NodeSource repository (Node 20) if Node is missing
  ansible.builtin.shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    creates: /usr/bin/node

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Create a service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Unpack the build artifact
  ansible.builtin.unarchive:
    src: "{{ app_artifact }}"
    dest: "{{ app_dir }}"
    owner: "{{ app_user }}"
  notify: Restart app

- name: Install production dependencies
  ansible.builtin.command: npm install --omit=dev
  args:
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Create the uploads folder (app writes photos here)
  ansible.builtin.file:
    path: "{{ app_dir }}/uploads"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Install the systemd service file
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify: Restart app

- name: Make sure the service is enabled and running
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait until the app listens on its port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    timeout: 60
